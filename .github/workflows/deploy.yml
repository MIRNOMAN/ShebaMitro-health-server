name: CI/CD Pipeline & Zero-Downtime Production Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────────────────────────
  # Stage 1: Quality Assurance (Lint, Unit Tests, Jest E2E Suite)
  # ──────────────────────────────────────────────────────────────
  lint-and-test:
    name: 🧪 Quality Gate (Lint, Unit & E2E Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: shebamitro_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d shebamitro_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚡ Generate Prisma Client
        run: npx prisma generate

      - name: 🗄️ Run Database Migrations (Postgres with pg_trgm)
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/shebamitro_test_db?schema=public
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=test_password psql -h localhost -U test_user -d shebamitro_test_db -c 'CREATE EXTENSION IF NOT EXISTS "pg_trgm";'
          PGPASSWORD=test_password psql -h localhost -U test_user -d shebamitro_test_db -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          npx prisma db push --skip-generate

      - name: 🔍 Run ESLint
        run: npm run lint

      - name: 🧪 Execute Unit Test Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/shebamitro_test_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: SuperSecretJwtKeyForTestEnvironmentMustBeLongEnough123!
        run: npm test -- --coverage --maxWorkers=2

      - name: 🔬 Execute Jest E2E Integration Suite
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/shebamitro_test_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: SuperSecretJwtKeyForTestEnvironmentMustBeLongEnough123!
        run: npm run test:e2e

      - name: 🏗️ Verify TypeScript Compilation Build
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # Stage 2: Container Image Build & Push with Layer Caching
  # ──────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Docker Multi-Stage Build & Push (<150MB)
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🚀 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: 📦 Build and Push Production Container (<150MB)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # Stage 3: Zero-Downtime Deployment (Kubernetes / AWS ECS)
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Zero-Downtime Deployment (Kubernetes / ECS)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # ── Option A: Kubernetes Rolling Update ─────────────────────
      - name: ☸️ Configure Kubectl Context
        if: ${{ env.KUBE_CONFIG != '' }}
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: 🔄 Execute Kubernetes Rolling Update Deployment
        if: ${{ env.KUBE_CONFIG != '' }}
        run: |
          IMAGE_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          kubectl set image deployment/shebamitro-backend api=$IMAGE_URI -n production
          kubectl rollout status deployment/shebamitro-backend -n production --timeout=300s
          echo "✅ Kubernetes Zero-Downtime Rolling Update completed successfully."

      # ── Option B: Amazon ECS Blue/Green or Rolling Deployment ──
      - name: ☁️ Configure AWS Credentials
        if: ${{ env.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: 🚢 Deploy to Amazon ECS with Service Stability Verification
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.ECS_CLUSTER != '' }}
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --services ${{ secrets.ECS_SERVICE }}
          echo "✅ Amazon ECS Zero-Downtime Deployment verified stable."
